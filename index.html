<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<article class="card-container">
    
    <!-- Card Image -->
    <img src="assets/images/illustration-article.svg" alt="Article illustration">

    <!-- Category -->
    <span class="category-tag">Learning</span>

    <!-- Publish Date -->
    <p class="publish-date">Published 21 Dec 2023</p>

    <!-- Card Text -->
    <div class="card-text">
      <h1 class="hover-text" tabindex="0">
        HTML & CSS foundations
      </h1>

      <p>
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>
    </div>

    <!-- Author -->
    <div class="author">
      <img src="assets/images/image-avatar.webp" alt="Author avatar" class="avatar">
      <span class="author-name">Greg Hooper</span>
    </div>
  </article>
</main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">KUKU MUBARAQ</a>.
  </footer>
</body>
</html>
